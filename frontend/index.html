<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1012">
    <title>Pneuma</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header class="topbar" hidden>
        <p class="brand">pne<span class="brand-accent">uma</span></p>
        <div class="topbar-right">
            <button type="button" id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
            <span class="conn" title="Connected"></span>
        </div>
    </header>

    <dialog id="settings" class="modal" aria-labelledby="settings-title">
        <div class="modal-body">
            <div class="modal-header">
                <h2 id="settings-title" class="modal-title">Settings</h2>
                <span class="conn" title="Connected"></span>
                <button type="button" id="settings-close" class="icon-btn" aria-label="Close" title="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-content">
                <p>Maximum File Size: <span id="cfg-max-file">– MB</span></p>
                <p>Maximum Text Length: <span id="cfg-max-text">– Characters</span></p>
                <p>Default Time to Live: <span id="cfg-default-ttl">– Minutes</span></p>
                <p>Maximum Time to Live: <span id="cfg-max-ttl">– Minutes</span></p>
            </div>

            <div class="modal-footer">
                <button type="button" id="logout-btn" class="btn">Log out</button>
            </div>

        </div>
    </dialog>

    <!-- login/register screen; shown when no valid token is found -->
    <section id="auth" class="auth" hidden>
        <p class="brand">pne<span class="brand-accent">uma</span></p>

        <form id="auth-form" class="auth-form">
            <label>
                Username
                <input id="auth-username" autocomplete="username" required>
            </label>

            <label>
                Password
                <input id="auth-password" type="password" autocomplete="current-password" required>
            </label>

            <!-- register only -->
            <label id="auth-confirm-row">
                Confirm password
                <input id="auth-confirm" type="password" autocomplete="new-password">
            </label>

            <button type="submit" id="auth-submit" class="btn btn-accent auth-submit">Log in</button>
        </form>

        <!-- "Need an account? Register" / "Have an account? Log in" -->
        <p class="auth-switch">
            <span id="auth-switch-text">Need an account?</span>
            <button type="button" id="auth-switch" class="link-btn">Register</button>
        </p>
    </section>

    <main class="app" hidden>
        <section id="dropper" class="dropper" tabindex="0" role="button" aria-label="Add a file or text">
            <div id="dropper-hint" class="dropper-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 16V4" />
                    <path d="m6 10 6-6 6 6" />
                    <path d="M4 20h16" />
                </svg>
                <p class="hint-main">Drop a file or paste to sync</p>
                <p class="hint-sub">
                    <span class="on-desktop">Ctrl+V to paste · click to browse</span>
                    <span class="on-touch">Tap to choose a file</span>
                </p>
                <input id="quick-text" class="quick-text" placeholder="Paste or type text…" autocomplete="off">
            </div>

            <div id="staged" class="staged" hidden>
                <div id="staged-file" class="staged-file" hidden>
                    <div class="entry-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                            <path d="M14 3v5h5" />
                        </svg>
                    </div>
                    <div class="entry-info">
                        <div id="staged-file-name" class="entry-name"></div>
                        <div id="staged-file-size" class="entry-meta"></div>
                    </div>
                </div>

                <textarea id="staged-text" placeholder="Paste or type text…" hidden></textarea>

                <div id="progress" class="progress" hidden>
                    <div></div>
                </div>
                <p id="status" class="status"></p>

                <div class="staged-actions">
                    <label class="ttl-input">Expires in:
                        <input id="ttl-h" type="number" min="0" inputmode="numeric"> h
                        <input id="ttl-m" type="number" min="0" max="59" inputmode="numeric"> m
                    </label>
                    <span id="char-count" class="char-count"></span>
                    <button type="button" id="cancel-btn" class="btn">Cancel</button>
                    <button type="button" id="submit-btn" class="btn btn-accent">Submit</button>
                </div>
            </div>

            <input type="file" id="file-input" hidden>
        </section>

        <section id="list-section" class="list-section" hidden>
            <div class="list-header">
                <span id="count">0 items</span>
                <button type="button" id="delete-all-btn" class="btn btn-ghost keep-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 7h16" />
                        <path d="M10 11v6" />
                        <path d="M14 11v6" />
                        <path d="M6 7l1 13h10l1-13" />
                        <path d="M9 7V4h6v3" />
                    </svg>
                    <span class="btn-label">Delete all</span>
                </button>
            </div>
            <ul id="entries" class="entries"></ul>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
